name: Test Central Server Module

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: |
          for p in db shared-types mqtt-broker queue auth; do
            npm run build --workspace=packages/$p
          done
      - run: npm test
